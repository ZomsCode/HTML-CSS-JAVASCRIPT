<!-- se genera un numero aleatorio entre 1 y 300,
el usuario introduce numeros hasta adivinarlo
el programa indicará si el numero introducido es mayor o menor que el secreto
como resultado indicará el numero de intentos y mostrara cual es el numero secreto-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>Numero Secreto</title>
</head>
<body>
    <h1>Adivina el numero secreto</h1>
    
    <script>
        function numSecreto(){
            let secreto =  Math.floor(Math.random() * 300) + 1;
            let miNum = 0;
            let veces = 0;

            do{
                miNum = Number(prompt("Numero: ", 0));
                veces++;
                
                if(miNum == secreto){
                    break;
                }else if(miNum < secreto){
                    alert("El numero secreto es mayor")
                }else if (miNum > secreto){
                    alert ("El numero secreto es menor")
                }
                
            }while (secreto != miNum);
            document.getElementById("salida").innerHTML = 
            "Enhorabuena, has adivinado el numero secreto " + secreto + " en los intentos "+ veces;
        }
    </script>
</body>
</html>
