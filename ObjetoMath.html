        function numeroRandom(){
            let i = 0;
            let control = document.getElementById("salida")
            while(i<= 25){
                control.innerHTML += Math.random() + "<br>";
                i++;
            }
        }
        function aleatorioEntre(){
            let min = parseInt(prompt("Ingrese el valor mínimo:"));
            let max = parseInt(prompt("Ingrese el valor máximo:"));
            let i = 0;
            let control = document.getElementById("salida");
            control.innerHTML += "<br>Números aleatorios entre " + min + " y " + max + ":<br>";
            while(i<= 25){
                let numeroAleatorio = Math.floor(Math.random() * (max - min + 1)) + min;
                control.innerHTML += numeroAleatorio + "<br>";
                i++;
            }
        }
